<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Desafio 30 dias">
  <!-- Marca reduzida ao "30": e o que sobrevive a 16px na aba do navegador.
       Laranja da identidade no fundo para o icone se destacar tanto na aba
       clara quanto na escura; o texto usa o marrom do fundo do site. -->
  <rect width="64" height="64" rx="14" fill="#ff3300"/>
  <text x="32" y="33" fill="#160100"
        font-family="'Red Hat Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="900" letter-spacing="-1.5"
        text-anchor="middle" dominant-baseline="central">30</text>
</svg>
